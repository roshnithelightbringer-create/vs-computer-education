<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70">
  <defs>
    <linearGradient id="vgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0f3a8e"/>
    </linearGradient>
  </defs>
  
  <!-- Monitor icon -->
  <rect x="4" y="10" width="32" height="24" rx="3" fill="none" stroke="url(#vgrad)" stroke-width="2.5"/>
  <rect x="8" y="14" width="24" height="16" rx="1" fill="url(#vgrad)" opacity="0.15"/>
  <line x1="20" y1="34" x2="20" y2="42" stroke="url(#vgrad)" stroke-width="2.5"/>
  <line x1="12" y1="42" x2="28" y2="42" stroke="url(#vgrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Screen glow -->
  <rect x="10" y="16" width="20" height="12" rx="0.5" fill="url(#vgrad)" opacity="0.08"/>
  
  <!-- SX inside box -->
  <rect x="40" y="10" width="34" height="34" rx="4" fill="url(#vgrad)"/>
  <text x="57" y="31" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">SX</text>
  
  <!-- Vertical text: COMPUTER EDUCATION -->
  <text x="80" y="16" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#1a56db" letter-spacing="1">COMPUTER</text>
  <text x="80" y="28" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#4b5563" letter-spacing="1">EDUCATION</text>
</svg>