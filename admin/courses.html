<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manage Courses - VS Computer Education Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><nav class="admin-nav"><div class="admin-nav-brand">VS Computer Education</div><ul class="admin-nav-links"><li><a href="dashboard.html">Dashboard</a></li><li><a href="courses.html" class="active">Courses</a></li><li><a href="enquiries.html">Enquiries</a></li><li><a href="demos.html">Demo Bookings</a></li><li><a href="#" id="logoutBtn">Logout</a></li></ul></nav><main class="admin-main"><div class="admin-header"><h1>Manage Courses</h1><button class="btn btn-primary" id="addCourseBtn">+ Add Course</button></div><div id="coursesContainer"><p class="text-muted">Loading courses...</p></div></main><div id="courseModal" class="modal" style="display:none"><div class="modal-content"><span class="modal-close" id="closeModal">&times;</span><h2 id="modalTitle">Add Course</h2><form id="courseForm"><input type="hidden" id="courseId"><div class="form-group"><label>Title</label><input type="text" id="courseTitle" required></div><div class="form-group"><label>Category</label><input type="text" id="courseCategory" placeholder="e.g. Basic Computer, Accounting"></div><div class="form-group"><label>Short Description</label><textarea id="courseShortDesc" rows="2"></textarea></div><div class="form-group"><label>Duration</label><input type="text" id="courseDuration" placeholder="e.g. 3 Months"></div><div class="form-group"><label>Eligibility</label><input type="text" id="courseEligibility" placeholder="e.g. Anyone"></div><div class="form-group"><label>Description</label><textarea id="courseDesc" rows="4"></textarea></div><div class="form-group"><label>Syllabus</label><textarea id="courseSyllabus" rows="6" placeholder="One topic per line"></textarea></div><button type="submit" class="btn btn-primary btn-block">Save Course</button></form></div></div><script src="../js/admin.js"></script></body></html>
